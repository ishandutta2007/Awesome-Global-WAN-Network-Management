<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 40px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 19px; fill: #93c5fd; }
      .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #e0e7ff; }
      
      @keyframes pulse-node {
        0%, 100% { r: 6px; opacity: 0.8; }
        50% { r: 10px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes float-card {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .node { animation: pulse-node 3s infinite ease-in-out; }
      .pulse-line { stroke-dasharray: 8, 8; animation: dash-flow 2s linear infinite; }
      .card-1 { animation: float-card 4s infinite ease-in-out; }
      .card-2 { animation: float-card 4s infinite ease-in-out 2s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Network Connections (Background Flow) -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" fill="none">
    <path d="M 100 80 Q 300 200 600 100 T 1100 220" class="pulse-line" />
    <path d="M 50 240 Q 400 100 800 260 T 1150 80" class="pulse-line" />
  </g>

  <!-- Dynamic Network Nodes (Background) -->
  <circle cx="100" cy="80" r="6" fill="#38bdf8" class="node" style="animation-delay: 0s;" />
  <circle cx="600" cy="100" r="6" fill="#818cf8" class="node" style="animation-delay: 1s;" />
  <circle cx="1100" cy="220" r="6" fill="#c084fc" class="node" style="animation-delay: 2s;" />
  <circle cx="400" cy="220" r="5" fill="#38bdf8" class="node" style="animation-delay: 1.5s;" />

  <!-- Background Decorative Floating Pill Badges -->
  <g class="card-1" opacity="0.85">
    <rect x="840" y="45" width="180" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="930" y="71" text-anchor="middle" class="badge-text">🌐 SD-WAN Fabric</text>
  </g>
  <g class="card-2" opacity="0.85">
    <rect x="940" y="135" width="200" height="42" rx="21" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="1040" y="161" text-anchor="middle" class="badge-text">⚡ Multi-Cloud WAN</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(60, 130)">
    <!-- Decorative Accent Bar -->
    <rect x="0" y="-45" width="8" height="110" rx="4" fill="url(#accent-grad)" filter="url(#glow)" />
    
    <!-- Header Title -->
    <text x="28" y="0" class="title">Awesome Global WAN Network Management 🌐</text>
    
    <!-- Subtitle -->
    <text x="28" y="40" class="subtitle">Curated Directory of Commercial SD-WAN Platforms &amp; Open-Source WAN Controllers</text>
    
    <!-- Tags -->
    <g transform="translate(28, 65)">
      <rect x="0" y="0" width="150" height="28" rx="14" fill="#0369a1" />
      <text x="75" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff">SD-WAN Orchestration</text>
      
      <rect x="160" y="0" width="130" height="28" rx="14" fill="#4338ca" />
      <text x="225" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff">Zero-Touch SASE</text>
      
      <rect x="300" y="0" width="150" height="28" rx="14" fill="#6d28d9" />
      <text x="375" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff">Open-Source BGP/OSPF</text>
    </g>
  </g>
</svg>
